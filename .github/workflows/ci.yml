name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Ordixa CLI smoke test
        run: |
          python -m app.ordixa check-profile --profile examples/ordixa/profiles/harbor-lane.toml
          python -m app.ordixa check-profile --profile examples/ordixa/profiles/juniper-row.toml
          python -m app.ordixa inspect --input examples/ordixa/exports/text-ids
          python -m app.ordixa check-profile --profile examples/ordixa/profiles/harbor-lane.toml --input examples/ordixa/exports/pilot/3-final-delivery
          python -m app.ordixa check-profile --profile examples/ordixa/profiles/harbor-lane.toml --input examples/ordixa/exports/pilot/1-first-delivery && exit 1 || test $? -eq 3
          python -m app.ordixa run --profile examples/ordixa/profiles/harbor-lane.toml --input examples/ordixa/exports/problematic --out output/ci
          python -m app.ordixa run --profile examples/ordixa/profiles/juniper-row.toml --input examples/ordixa/exports/text-ids --out output/ci
          python -m app.ordixa.demo --out output/ci-demo
          python -m app.ordixa verify --run "$(find output/ci-demo -mindepth 1 -maxdepth 1 -name 'run-*' -type d)" --input examples/ordixa/exports/demo
          test "$(find output/ci -mindepth 1 -maxdepth 1 -name 'run-*' -type d | wc -l)" -eq 2
          test -z "$(find output/ci -mindepth 1 -maxdepth 1 -name '.run-*')"
          test -z "$(git status --porcelain)"

      - name: Spreadsheet clean/compare smoke test
        run: |
          python -m app.ordixa check-profile --profile examples/ordixa/profiles/inventory-clean.toml --input examples/ordixa/exports/inventory/inventory-after.csv
          python -m app.ordixa clean --profile examples/ordixa/profiles/inventory-clean.toml --input examples/ordixa/exports/inventory/inventory-before.csv --out output/ci-clean
          python -m app.ordixa compare --profile examples/ordixa/profiles/inventory-compare.toml --before examples/ordixa/exports/inventory/inventory-before.csv --after examples/ordixa/exports/inventory/inventory-after.csv --out output/ci-compare
          python -m app.ordixa compare --profile examples/ordixa/profiles/inventory-clean.toml --before examples/ordixa/exports/inventory/inventory-before.csv --after examples/ordixa/exports/inventory/inventory-after.csv --out output/ci-compare && exit 1 || test $? -eq 2
          python -m app.ordixa verify --run "$(find output/ci-clean -mindepth 1 -maxdepth 1 -name 'run-*' -type d)" --input examples/ordixa/exports/inventory/inventory-before.csv
          python -m app.ordixa verify --run "$(find output/ci-compare -mindepth 1 -maxdepth 1 -name 'run-*' -type d)" --input examples/ordixa/exports/inventory
          python -m app.ordixa.inventory_demo --out output/ci-inventory-demo
          test "$(find output/ci-compare -mindepth 1 -maxdepth 1 -name 'run-*' -type d | wc -l)" -eq 1
          test -z "$(find output -name '.run-*')"
          test -z "$(git status --porcelain)"
